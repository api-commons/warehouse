context: warehouse
name: Warehouse Management
intro: >-
  The common warehouse vocabulary -- the warehouses and the bin locations inside them, the inbound
  receipts (ASNs) that bring stock in and the pick lists that send it out -- distilled from the
  APIs that already exist. Stock levels belong to commerce, outbound shipments to shipping.
tags: [Warehouse Management, WMS, 3PL, Fulfillment, Inventory Management, Warehousing, Order Fulfillment]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, resource]

common_fields:
  id: [uuid, guid, object_id, record_id, external_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified]
  metadata: [meta_data, custom_fields, custom, attributes, properties]
  status: [state, active, is_active]
  name: [title, display_name, label, warehouse_name]
  warehouse_id: [warehouse, facility_id, facility, location_id, fulfillment_center_id, site_id]

concepts:
  warehouse:
    segments: [warehouses, warehouse, facilities, facility, fulfillment_centers, fulfillment-centers, distribution_centers]
    aliases:
      address: [location, street_address, address1, shipping_address]
      code: [warehouse_code, short_code, identifier]
      time_zone: [timezone, tz]
  # bin was measured and dropped: 1 readable provider.
  inbound_receipt:
    path: /inbound-receipts
    segments: [asns, asn, inbound_shipments, inbound-shipments, inboundshipments, receivings, receiving, receipts@inbound|warehouse|purchase_orders, warehouse_receiving_orders, inbound_orders]
    aliases:
      expected_at: [expected_date, eta, expected_arrival, arrival_date]
      received_at: [received_date, completed_at, closed_at]
      purchase_order_number: [po_number, purchase_order, reference]
      line_items: [items, lines, products, skus]
  # pick_list was measured and dropped: 2 providers.

duplicates:
  extensiv: [3plcentral]

findings:
  - "A warehouse agrees on name, id and address across WMS, 3PL and inventory platforms. Everything
    that happens inside it -- bins, receiving, picking -- is barely published: inbound receipts at
    4 providers (agreeing on a status), bins and pick lists at 2 or fewer."
  - "3PLs expose the receiving workflow (ShipBob, ShipMonk) without exposing the warehouse; a
    warehouse is the customer's view, receiving is the operator's."
decisions:
  - "Facilities, fulfillment centers and distribution centers are warehouses."
  - "ASNs, inbound shipments and receivings are inbound receipts (`/inbound-receipts`) -- the
    concept procurement measured and dropped as goods receipts."
  - "Stock levels are commerce's inventory; outbound shipments are shipping's."
  - "Bins and pick lists were measured and dropped."
  - "Duplicates merged: 3PL Central into Extensiv."
